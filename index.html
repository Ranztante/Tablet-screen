<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Display</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  
  <style>
    body { 
      margin: 0; 
      /* System-Schriftarten für einen sauberen "Apple-Look" */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #000; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }
    
    /* Wetter: Apple-Style mit weichem Verlauf */
    #weather-container {
      flex: 1;
      background: linear-gradient(180deg, #2b659c 0%, #69a7dc 100%);
      padding: 15px;
      box-sizing: border-box;
      overflow: hidden;
    }

    #calendar-container {
      flex: 2;
      background: #fff;
      padding: 10px;
      box-sizing: border-box;
    }

    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      border-radius: 8px; 
    }
  </style>
</head>
<body>

  <!-- Wetter Bereich -->
  <div id="weather-container">
    <a class="weatherwidget-io" href="https://forecast7.com/de/51d3212d02/leuna/" data-label_1="LEUNA" data-label_2="WETTER" data-font="Helvetica" data-icons="Climacons Animated" data-theme="pure" data-textcolor="#ffffff" data-highcolor="#ffffff" data-lowcolor="#d0e8f2" data-mooncolor="#f1c40f" data-cloudcolor="#ffffff" data-cloudfill="#ffffff" data-raincolor="#d0e8f2" data-snowcolor="#ffffff" style="display: block; width: 100%; height: 100%;">LEUNA WETTER</a>
    <script>
    !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
    </script>
  </div>

  <!-- Kalender Bereich -->
  <div id="calendar-container">
    <iframe src="https://calendar.google.com/calendar/embed?src=cspittel99%40gmail.com&ctz=Europe%2FBerlin&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0" frameborder="0" scrolling="no"></iframe>
  </div>

</body>
</html>
